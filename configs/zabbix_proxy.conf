# /etc/zabbix/zabbix_proxy.conf on sa-proxy (only the lines we changed)
# The PSK file itself is NOT in this repo.

ProxyMode=0                                  # 0 = active: the proxy connects to the server
Server=<AZURE_PUBLIC_IP>                     # Zabbix server
Hostname=sa-proxy                            # must match the proxy name in the Zabbix UI
DBName=/var/lib/zabbix/zabbix_proxy.db       # SQLite database file
ProxyOfflineBuffer=24                        # keep up to 24 h of data if the server is unreachable
TLSConnect=psk                               # encrypt the proxy -> server link
TLSPSKIdentity=sa-proxy
TLSPSKFile=/etc/zabbix/zabbix_proxy.psk      # created with: openssl rand -hex 32

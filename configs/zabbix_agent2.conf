# /etc/zabbix/zabbix_agent2.conf on each web VM (only the lines we changed)

Server=192.168.1.54          # only sa-proxy may poll this agent (passive, used for zabbix_get debugging)
ServerActive=192.168.1.54    # where the agent pushes active checks (port 10051) - what our template uses
Hostname=sa-web1             # sa-web1 / sa-web2 / sa-web3 / sa-web4, must match the host name in the UI

# On sa-proxy itself the agent uses Server=127.0.0.1 / ServerActive=127.0.0.1 / Hostname=sa-proxy
# Also run once:  sudo usermod -aG adm zabbix   (read access to /var/log on Ubuntu)

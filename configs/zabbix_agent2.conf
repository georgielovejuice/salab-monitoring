# /etc/zabbix/zabbix_agent2.conf on each web VM (only the lines we changed)

Server=192.168.1.54          # only sa-proxy may poll this agent (passive checks, port 10050)
ServerActive=192.168.1.54    # where the agent sends active checks (port 10051), needed for log[] items
Hostname=sa-web1             # sa-web1 / sa-web2 / sa-web3, must match the host name in the Zabbix UI

# Also run once:  sudo usermod -aG adm zabbix   (read access to /var/log on Ubuntu)
